<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DAZN Bet in Scores — Motion</title>
<!-- A2 · Motion presets. Desktop only; nothing in the prototype links here.
     The phone is the real prototype (index.html?embed) in a frame. This page sets a state in it, starts one of its own
     animations, slows its clock, and — to try a preset — puts extra CSS on top of it. The prototype itself is never changed.
     Groups and presets: QS below. The inventory of every animation of the prototype: notes/MOTION.md. -->
<style>
@font-face{font-family:'DAZN Oscine';font-weight:400;src:url(assets/fonts/DAZN-Oscine-Regular.woff2) format('woff2');ascent-override:104.8%;descent-override:24%;line-gap-override:0%}
@font-face{font-family:'DAZN Oscine';font-weight:700;src:url(assets/fonts/DAZN-Oscine-Bold.woff2) format('woff2');ascent-override:104.8%;descent-override:24%;line-gap-override:0%}
/* the same chrome variables as the "Prototype states" panel in index.html (Global foundation, dark); no other colours on this page */
:root{
  --ui-canvas:#1b2326;                 /* surface/container-2 */
  --ui-panel:#0c161c;                  /* surface/container-1 */
  --ui-well:#080e12;                   /* surface/default-0 */
  --ui-line:#242d33;                   /* border/full-color/subtle */
  --ui-hover:rgba(249,250,250,0.04);   /* fill/overlay-1 */
  --ui-on:rgba(249,250,250,0.08);      /* fill/overlay-2 */
  --ui-thumb:rgba(249,250,250,0.12);   /* fill/overlay-3 */
  --ui-t1:#f9fafa;                     /* text/primary */
  --ui-t2:#c5c7ca;                     /* text/secondary */
  --ui-t3:#8d9295;                     /* text/tertiary */
}
/* One spacing scale for the whole page: 4 / 8 / 12 / 16 / 24. Control heights 24 / 32 / 40. Type 12/16, 14/20, 16/24, 20/24, 24/32. Radii 4 / 8 / 16. */
/* One spacing scale for the whole page: 4 / 8 / 12 / 16 / 24. Control heights 24 / 32 / 40. Type 12/16, 14/20, 16/24, 20/24, 24/32. Radii 4 / 8 / 16. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ui-canvas);font-family:'DAZN Oscine',system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--ui-t2);-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:248px minmax(520px,1fr);gap:12px;padding:12px;min-width:1100px;overflow:auto hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ui-t1);outline-offset:-2px}
[hidden]{display:none!important}
.panel{min-height:0;display:flex;flex-direction:column;border-radius:16px;background:var(--ui-panel);box-shadow:0 0 0 1px var(--ui-line)}
.scroll{min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ui-line) transparent}

/* segmented control and buttons */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:center;padding:4px;border-radius:8px;background:var(--ui-well)}
.seg button{height:24px;padding:0 8px;border-radius:4px;font-weight:700;font-size:12px;line-height:16px;color:var(--ui-t3);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--ui-thumb);color:var(--ui-t1)}
.seg button:not(.on):hover{color:var(--ui-t2)}
.btn{flex:none;height:32px;padding:0 12px;border-radius:8px;background:var(--ui-t1);font-weight:700;font-size:12px;line-height:16px;color:var(--ui-well);white-space:nowrap;transition:opacity .2s,background .2s}
.btn:hover{opacity:.85}
.btn.q{background:var(--ui-on);color:var(--ui-t1)}
.btn.q:hover{opacity:1;background:var(--ui-thumb)}
.btn.big{width:100%;height:40px;font-size:14px;line-height:20px}
.lnk{height:32px;padding:0 12px;border-radius:8px;font-weight:700;font-size:12px;line-height:16px;color:var(--ui-t2);transition:background .2s,color .2s}
.lnk:hover{background:var(--ui-hover);color:var(--ui-t1)}

/* left panel: groups with a chevron; the open group lists its animations on a guide line; My decisions is pinned below */
.ph{flex:none;padding:16px 16px 12px;font-weight:700;font-size:16px;line-height:24px;color:var(--ui-t1)}
.list{flex:1;padding:0 8px 8px;display:flex;flex-direction:column}
.gq{flex:none;display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px;border-radius:8px;text-align:left;color:var(--ui-t1);transition:background .2s}
.gq:hover{background:var(--ui-hover)}
.gq svg{flex:none;color:var(--ui-t3);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.gq.open svg{transform:rotate(90deg);color:var(--ui-t1)}
.gq>span{flex:1;min-width:0}
.gq b,.gq small{display:block}
.gq small,.pq small{font-size:12px;line-height:16px;font-weight:400;color:var(--ui-t3)}
.gq small:empty{display:none}
.gq.done small{color:var(--ui-t2)}
.gq.done small::after{content:" ✓"}
.gs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.32,.72,0,1)}
.gs.open{grid-template-rows:1fr}
.gs>div{min-height:0;overflow:hidden;display:flex;flex-direction:column;margin-left:16px;padding-left:8px;border-left:1px solid var(--ui-line)}
.gs.open>div{margin-bottom:8px}
.pq{flex:none;display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:8px 12px;border-radius:8px;text-align:left;color:var(--ui-t2);transition:background .2s,color .2s}
.pq:hover{background:var(--ui-hover);color:var(--ui-t1)}
.pq.on{background:var(--ui-on);color:var(--ui-t1);font-weight:700}
.pq span{flex:1;min-width:0}
.pq small{flex:none}
.alld{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 8px 8px;padding:12px 16px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--ui-line);text-align:left;transition:background .2s}
.alld:hover{background:var(--ui-hover)}
.alld.on{background:var(--ui-on)}
.alld b{color:var(--ui-t1)}
.alld small{font-size:12px;line-height:16px;color:var(--ui-t3)}

/* stage: the phone, or (Compare / Zoom) one or two framed prototypes; then the control column */
.stage{min-width:0;min-height:0;display:flex;gap:12px}
.view{flex:1;min-width:0;min-height:0;position:relative}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:16px;background:var(--ui-canvas)}
#frame.off{visibility:hidden}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n,1),1fr);gap:12px;align-content:start}
.grid.tall{grid-template-columns:repeat(var(--n,1),var(--cw,240px));justify-content:center}
.card{min-width:0;border-radius:16px;background:var(--ui-panel);box-shadow:0 0 0 1px var(--ui-line);overflow:hidden;display:flex;flex-direction:column}
.cl{flex:none;display:flex;align-items:center;height:40px;padding:0 16px;font-weight:700;color:var(--ui-t1)}
.vp{flex:none;position:relative;height:var(--vh,240px);overflow:hidden;background:var(--ui-canvas)}
.vp iframe{position:absolute;left:0;top:0;width:560px;height:1032px;border:0;transform-origin:0 0}

/* My decisions */
.sum{position:absolute;inset:0;padding:24px;display:block}
.sum h1{font-size:24px;line-height:32px;color:var(--ui-t1);margin-bottom:16px}
.sr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--ui-line);align-items:baseline;cursor:pointer}
.sr b{color:var(--ui-t1)}
.sr span.no,.sr small{color:var(--ui-t3)}
.sr small{grid-column:1/-1;font-size:12px;line-height:16px}
.sr.sub{padding:8px 0 8px 16px;border-top:0}
.sr.sub b{font-weight:400;color:var(--ui-t2)}
.acts{display:flex;gap:8px;margin-top:24px}
.sum h2{margin:24px 0 8px;font-size:12px;line-height:16px;color:var(--ui-t3)}
.sum ul{padding-left:16px}
.sum li{margin-bottom:4px;font-size:12px;line-height:16px}

/* control column */
.rc{flex:none;width:328px;min-height:0;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.qh{flex:none;padding:4px 4px 0}
.qh span{display:block;font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t3)}
.qh h1{font-size:20px;line-height:24px;font-weight:700;color:var(--ui-t1)}
.err{flex:none;padding:8px 12px;border-radius:8px;background:var(--ui-on);font-size:12px;line-height:16px;color:var(--ui-t1)}
.dock{flex:none;padding:16px;gap:16px}
.lbl{font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t3)}
.dock>.lbl{margin-bottom:-8px}          /* a label sits 8 px above what it names, 16 px below what came before */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{height:32px;padding:0 12px;border-radius:16px;background:var(--ui-hover);box-shadow:inset 0 0 0 1px var(--ui-line);font-weight:700;font-size:12px;line-height:16px;color:var(--ui-t2);white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.chip2:hover{background:var(--ui-on);color:var(--ui-t1)}
.chip2.on{background:var(--ui-t1);box-shadow:none;color:var(--ui-well)}
.chip2.ap::after{content:" ✓"}
.pr{display:flex;flex-direction:column;gap:8px}
.pr:empty{display:none}
/* a variant row: name, five steps */
.vr{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:12px;min-height:32px;font-size:12px;line-height:16px}
.vr .seg button{padding:0 4px}
/* a value row: name, slider, the same value as a number */
.prm{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:0 8px;min-height:32px;font-size:12px;line-height:16px}
.prm input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:24px;background:none;cursor:pointer;touch-action:none}
.prm input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--ui-thumb)}
.prm input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--ui-thumb)}
.prm input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border:0;border-radius:50%;background:var(--ui-t1);box-shadow:0 0 0 4px var(--ui-panel);transition:transform .2s}
.prm input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ui-t1);box-shadow:0 0 0 4px var(--ui-panel)}
.prm input[type=range]:hover::-webkit-slider-thumb,.prm input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.prm input[type=range]:focus-visible{outline:0}
.prm input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--ui-thumb)}
.nf{display:flex;align-items:center;gap:4px;height:24px;padding-right:4px;border-radius:4px;background:var(--ui-well);cursor:text}
.nf input{width:100%;min-width:0;height:24px;padding-left:4px;border:0;background:none;font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t1);text-align:right;outline:0;-moz-appearance:textfield}
.nf input::-webkit-inner-spin-button{display:none}
.nf i{flex:none;font-style:normal;font-size:12px;color:var(--ui-t3)}
.nf:focus-within{box-shadow:inset 0 0 0 1px var(--ui-t3)}
.ends{grid-column:2;display:flex;justify-content:space-between;padding-bottom:4px;font-size:12px;line-height:16px;color:var(--ui-t3);pointer-events:none} /* never in the way of the slider above it */
.prm.sel{grid-template-columns:72px 1fr 32px}
.prm select{width:100%;height:32px;padding:0 8px;border-radius:8px;border:0;background:var(--ui-well);font-size:12px;color:var(--ui-t1)}
.prm svg{display:block;width:32px;height:32px;border-radius:8px;background:var(--ui-well);color:var(--ui-t1)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* a switch row: label on the left, switch on the right; the three viewing switches sit together */
.tgl{display:flex;flex-direction:column}
.chk{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;font-size:12px;line-height:16px;cursor:pointer;transition:color .2s}
.chk+.chk{border-top:1px solid var(--ui-line)}
.chk:hover{color:var(--ui-t1)}
.chk input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:32px;height:20px;border-radius:12px;background:var(--ui-thumb);cursor:pointer;transition:background .2s}
.chk input::after{content:"";position:absolute;left:4px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--ui-t2);transition:transform .2s,background .2s}
.chk input:checked{background:var(--ui-t1)}
.chk input:checked::after{transform:translateX(12px);background:var(--ui-well)}
.chk input:focus-visible{outline:2px solid var(--ui-t1);outline-offset:4px}
.apply{display:flex;flex-direction:column;gap:8px}
.apply .lnk{align-self:center}
/* Advanced, and Today inside it: a row with a chevron that opens its content */
.adv{border-top:1px solid var(--ui-line);padding-top:8px}
.adv>summary,.today>summary{display:flex;align-items:center;gap:8px;height:40px;margin:0 -4px;padding:0 4px;border-radius:8px;list-style:none;cursor:pointer;font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t3);outline:0;transition:background .2s,color .2s}
.adv>summary::-webkit-details-marker,.today>summary::-webkit-details-marker{display:none}
.adv>summary::before,.today>summary::before{content:"";flex:none;width:8px;height:8px;margin:0 4px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg) scale(.75);transition:transform .2s}
.adv[open]>summary::before,.today[open]>summary::before{transform:rotate(45deg) scale(.75)}
.adv>summary:hover,.today>summary:hover,.adv>summary:focus-visible,.today>summary:focus-visible{background:var(--ui-hover);color:var(--ui-t1)}
.adv[open]>summary{color:var(--ui-t1);margin-bottom:8px}
.adv>.pr{gap:12px;padding-bottom:16px}
.today,.adv>.lbl{border-top:1px solid var(--ui-line)}
.today{padding-top:8px}
.today ul{margin-bottom:12px;padding:12px 12px 12px 28px;border-radius:8px;background:var(--ui-well)}
.today li{margin-bottom:8px;font-size:12px;line-height:16px}
.today li:last-child{margin:0}
.adv>.lbl{display:block;padding-top:16px}
#why{display:block;width:100%;margin-top:8px;resize:none;min-height:56px;padding:12px;border-radius:8px;border:0;background:var(--ui-well);box-shadow:inset 0 0 0 1px var(--ui-line);font-size:12px;line-height:16px;color:var(--ui-t1);outline:0;transition:box-shadow .2s}
#why:focus{box-shadow:inset 0 0 0 1px var(--ui-t3)}
</style>
</head>
<body>
<aside class="panel">
 <div class="ph">Motion</div>
 <div class="scroll list" id="list"></div>
 <button class="alld" id="allDec"><b>My decisions</b><small></small></button>
</aside>

<main class="stage">
 <div class="view">
  <iframe id="frame" src="index.html?embed" title="Prototype"></iframe>
  <div class="grid" id="grid" hidden></div>
  <div class="panel sum scroll" id="sum" hidden></div>
 </div>
 <!-- everything you control sits in this one column; the phone gets the full height -->
 <aside class="rc scroll">
  <div class="qh" id="qh"><span id="qN"></span><h1 id="qT"></h1></div>
  <p class="err" id="err" hidden></p>
  <div class="panel dock" id="dock">
   <!-- basic: a preset, its ready-made variants (how strong, how long), watch, apply -->
   <span class="lbl">Presets</span>
   <div class="chips" id="presets"></div>
   <div class="pr" id="basic"></div>
   <div class="dh"><div class="seg" id="speed" role="tablist" aria-label="Speed"><button role="tab" data-r="1" class="on">1×</button><button role="tab" data-r="0.5">0.5×</button><button role="tab" data-r="0.1">0.1×</button></div><button class="btn q" id="again">Play again</button></div>
   <div class="tgl">
    <label class="chk"><span>Compare with Current</span><input type="checkbox" id="cmp"></label>
    <label class="chk"><span>Zoom</span><input type="checkbox" id="zoom"></label>
    <label class="chk"><span>Loop</span><input type="checkbox" id="loop"></label>
   </div>
   <div class="apply"><button class="btn big" id="applyB">Apply to the group</button><button class="btn q big" id="onlyB">Only this one</button><button class="lnk" id="backB" hidden>Use the group’s preset here</button></div>
   <!-- advanced: the exact values as sliders, what the preset replaces, a note -->
   <details class="adv"><summary>Advanced</summary>
    <div class="pr" id="mo"></div>
    <details class="today"><summary>Today</summary><ul id="todayL"></ul></details>
    <label class="lbl" for="why">Note</label><textarea id="why" rows="2"></textarea>
   </details>
  </div>
 </aside>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n2=n=>String(+(+n).toFixed(3)).replace(/^0\./,'.').replace(/^-0\./,'-.');
const clone=x=>JSON.parse(JSON.stringify(x)),same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const fail=t=>{const e=$('#err');e.textContent=t;e.hidden=!t};

/* ---------- scenarios ----------
 How each animation of the prototype is shown: setup puts the prototype in a state (instantly), play starts the animation.
 Both run INSIDE the prototype, with its own names (S, P3, openSheet…). G.* are helpers of this page (see makeProto). */
const SCN={
 M01:{setup:"",play:"G.press('#feed .odd[data-m=\"m1\"][data-o=\"1\"]')"},
 M02:{setup:"openFixture('m4');G.show('#mkts .choice','#fxScroll')",play:"G.press('#mkts .choice')"},
 M03:{setup:"openComp('ucl','scorer')",play:"G.press('#cpScroll .tp')"},
 M04:{setup:"openComp('ucl','win')",play:"G.press('#cpScroll .cp-row')"},
 M05:{setup:"S.sel=P3();refresh();openSheet();",play:"G.press('#placeBtn')"},
 M06:{setup:"S.sel=P3();refresh();",play:"G.press('#bar')"},
 M07:{setup:"S.sel=P3();refresh();openSheet();",play:"G.press('#editBtn',600)"},
 M09:{setup:"",play:"G.click('#feed .odd[data-m=\"m1\"][data-o=\"1\"]');G.after(1000,()=>G.click('#feed .odd[data-m=\"m1\"][data-o=\"1\"]'))"},
 M10:{setup:"openComp('ucl','scorer')",play:"G.click('#cpScroll .tp');G.after(1000,()=>G.click('#cpScroll .tp'))"},
 M11:{setup:"",play:"G.click('#oddsChip');G.after(1200,()=>G.click('#oddsChip'))"},
 M12:{setup:"",play:"G.click('#liveBadge');G.after(1200,()=>G.click('#liveBadge'))"},
 M15:{setup:"S.sel=ONE();refresh();openSheet();",play:"S.st['m1|1x2']='suspended';refresh();G.after(1300,()=>{delete S.st['m1|1x2'];refresh()})"},
 M17:{setup:"S.sel=P3();refresh();openSheet();",play:"G.click('#editBtn');G.after(1400,()=>G.click('#editBtn'))"},
 M21:{setup:"",play:"changeOdd(M('m2'),1,0,2.45);changeOdd(M('m1'),2,0,9.10)"},
 M23:{setup:"S.sel=P3();refresh();openSheet();",play:"moved()"},
 M24:{setup:"S.sel=P3();refresh();",play:"moved()"},
 M27:{setup:"S.sel=ONE();refresh()",play:"G.click('#feed .odd[data-m=\"m2\"][data-o=\"0\"]');G.after(1100,()=>G.click('#feed .odd[data-m=\"m3\"][data-o=\"0\"]'));G.after(2200,()=>G.click('#feed .odd[data-m=\"m2\"][data-o=\"0\"]'))"},
 M28:{setup:"",play:"G.click('#oddsChip');G.after(1500,()=>G.click('#oddsChip'))"},
 M31:{setup:"",play:"G.click('#feed .odd[data-m=\"m1\"][data-o=\"0\"]');G.after(1400,()=>G.click('#feed .odd[data-m=\"m1\"][data-o=\"0\"]'))"},
 M32:{setup:"S.sel=P3();refresh();",play:"openSheet();G.after(1400,closeSheet)"},
 M34:{setup:"",play:"openFav();G.after(1600,closeFav)"},
 M35:{setup:"openFixture('m4');G.show('#fxMore','#fxScroll')",play:"G.click('#fxMore')"},
 M37:{setup:"S.sel=P3();refresh();openSheet();",play:"G.click('#placeBtn');G.after(1500,()=>G.click('#ovClose'))"},
 M38:{setup:"S.sel=ONE();refresh()",play:"openFixture('m4');G.after(1400,closeFixture)"},
 M39:{setup:"",play:"openComp('ucl','win');G.after(1400,closeComp)"},
 M42:{setup:"openComp('ucl','win')",play:"G.click('[data-cpt=\"scorer\"]');G.after(1200,()=>G.click('[data-cpt=\"win\"]'))"}
};
/* the element to zoom to; an animation without one is shown as the whole phone */
const FOCUS={M01:'#feed .odd[data-m="m1"][data-o="1"]',M02:'#mkts .choice',M03:'#cpScroll .tp',M04:'#cpScroll .cp-row',M05:'#placeBtn',M06:'#bar',M07:'#editBtn',
 M09:'#feed .odd[data-m="m1"][data-o="1"]',M10:'#cpScroll .tp',M11:'#oddsChip',M12:'#liveBadge',M15:'#placeBtn',M17:'#cards .cardwrap',M21:'#feed [data-tile="m1"]',M23:'[data-card="m4|1x2"]',M24:'#bar',M27:'#bar'};

/* ---------- a prototype in a frame ----------
 The big phone and the framed ones are the same thing: index.html?embed in a frame, driven by makeProto().
 vp = the box a framed prototype is cropped to (null for the big phone); whole = show the whole phone in it, not a close-up. */
let rate=1;
function makeProto(F,vp,whole){
 const P={F,W:null,D:null,ready:false,runId:0,pressed:[],anim:null,onready:null,ov:null};
 const q=s=>P.D.querySelector(s),scale=()=>+q('#stage').dataset.scale||1;
 const G={                                  // helpers for the scenarios; live on the prototype's window as G

const hasAmt=(q,i)=>!!q.amt||isSpring(q.presets[i].m.ease);
const edited=(q,i,p)=>i>=0&&!same(clone({fx:q.presets[i].fx,m:q.presets[i].m}),p);
function pick(i){const q=QS[qi];ps=i;va=vs=MID;pp=i<0?null:variant(q,i,MID,MID)}
/* what the controls show for this animation: its own exception if it has one, else the group's preset, else Current */
function loadTarget(){const q=QS[qi],d=exOf(q,pi)||dec[q.id];
 if(d&&d.i>=0){ps=d.i;pp=clone(d.p);[va,vs]=d.v||[-1,-1]}else pick(-1)}
const nowDec=()=>({i:ps,p:pp?clone(pp):null,v:[va,vs]});
const dropEx=()=>{const q=QS[qi];if(ex[q.id]){delete ex[q.id][pi];if(!Object.keys(ex[q.id]).length)delete ex[q.id]}};

/* ---------- a decision in words ---------- */
const presetName=(q,d)=>d.i<0?'Current':q.presets[d.i].n+(d.v&&d.v[0]>=0?(d.v[0]===MID&&d.v[1]===MID?'':' · '+[hasAmt(q,d.i)&&d.v[0]!==MID?'amount '+STEP[d.v[0]]:'',d.v[1]!==MID?'duration '+STEP[d.v[1]]:''].filter(Boolean).join(', ')):edited(q,d.i,d.p)?' (edited)':'');
/* the Motion of a decision, the way a developer needs it */
function moText(q,m){const k=mo(m);
 return (isSpring(m.ease)?`spring ${ezName(m.ease)} (duration ${m.dur} ms, bounce ${Math.round(m.bounce*100)}%, settles in ${k.t} ms)`:`${ezName(m.ease)} cubic-bezier(${bezOf(m).map(n2).join(', ')}), ${m.dur} ms`)+(q.delay?`, ${m.delay} ms per item`:'')}
function decText(q,d=dec[q.id]){if(!d)return '';if(d.i<0)return 'Current (no change)';
 const fx=q.fx.map(f=>f.l.toLowerCase()+' '+f.fmt(d.p.fx[f.k])).join(', ');
 return presetName(q,d)+' — '+(fx?fx+'; ':'')+moText(q,d.p.m)}
function decisionsText(){
 return 'Motion presets — DAZN Bet in Scores\n'+QS.map((q,i)=>`${i+1}. ${q.t}: ${decText(q)||'not decided'}`+exList(q).map(([pl,d])=>`\n   Except ${pl.n}: ${decText(q,d)}`).join('')+(notes[q.id]?`\n   Why: ${notes[q.id]}`:'')).join('\n')+'\n\nFor development:\n'+DEVNOTES.map(t=>'- '+t).join('\n');
}
const shareLink=()=>location.href.split('#')[0]+'#d='+btoa(unescape(encodeURIComponent(JSON.stringify({dec,notes,ex}))));

/* ---------- playing ---------- */
/* what is put on top of the prototype: every group that already has an applied preset, plus what is being tried in this group */
function ovNow(){
 const q=QS[qi],parts=[];
 QS.forEach(x=>{const p=x===q?(ps<0?null:pp):dec[x.id]&&dec[x.id].i>=0?dec[x.id].p:null;if(p)parts.push(x.apply(p.fx,mo(p.m),p.m))});
 return parts.length?{css:parts.slice().reverse().map(o=>o.css||'').join(''),   // reversed: the press rules come last, so on buttons their release curve wins over the state group's
  js:(W,o)=>parts.forEach(x=>x.js&&x.js(W,o))}:null;
}
let cmp=false,zoom=false,loopOn=false,loopT;
/* one big phone; or, with Compare or Zoom on, framed prototypes (Compare: left = Current, right = the preset) */
function buildView(){
 const a=QS[qi].places[pi];
 if(!cmp&&!zoom){dropCards();$('#frame').classList.remove('off');return}
 showCards(cmp?[Object.assign({},a,{tag:'Current'}),Object.assign({},a,{tag:'Your preset'})]:[Object.assign({},a,{tag:a.n})],!zoom);
}
/* play the animation of this place with what is being tried; rebuild = the place or the way of viewing changed */
function play(rebuild=true){
 clearTimeout(loopT);if(qi>=QS.length)return;
 const q=QS[qi],ov=ovNow(),framed=cmp||zoom;
 if(rebuild||framed!==!$('#grid').hidden)buildView();
 if(framed){cards.forEach((c,n)=>{c.ov=n===cards.length-1?ov:null});if(cards.every(c=>c.ready))cards.forEach(c=>c.run(c.anim))}   // not loaded yet: they start by themselves when ready
 else{main.ov=ov;main.run(q.places[pi])}
 if(loopOn)loopT=setTimeout(()=>play(false),((q.lp||2800)+(ps<0?0:2*mo(pp.m).t))/rate);   // a long preset gets a longer pause, so a loop never cuts it short
}
let prT;const later=()=>{clearTimeout(prT);prT=setTimeout(()=>play(false),140)};   // plays as soon as the hand rests

/* ---------- screens ---------- */
/* open a group on one of its animations; n = QS.length opens My decisions */
function go(n,place=0){
 qi=Math.max(0,Math.min(QS.length,n));
 if(qi===QS.length){showSummary();return}
 pi=Math.max(0,Math.min(QS[qi].places.length-1,place));loadTarget();
 $('#sum').hidden=true;$('#why').value=notes[QS[qi].id]||'';paint();play();   // the note belongs to the group
}
function showSummary(){
 clearTimeout(loopT);dropCards();$('#frame').classList.add('off');if(main.ready)main.reset();main.ov=null;
 const s=$('#sum');s.hidden=false;
 s.innerHTML=`<h1>My decisions</h1>`+QS.map((q,i)=>`<div class="sr" data-q="${i}" role="button" tabindex="0"><b>${esc(q.t)}</b><span${dec[q.id]?'':' class="no"'}>${esc(decText(q)||'Not decided')}</span>${notes[q.id]?`<small>Why: ${esc(notes[q.id])}</small>`:''}</div>`+
   exList(q).map(([pl,d])=>`<div class="sr sub" data-q="${i}" data-p="${q.places.indexOf(pl)}" role="button" tabindex="0"><b>Except ${esc(pl.n)}</b><span>${esc(decText(q,d))}</span></div>`).join('')).join('')+
  `<div class="acts"><button class="btn" id="copyDec">Copy decisions</button><button class="btn q" id="copyLink" title="A link that opens this page with the same decisions">Copy link</button></div><h2>For development</h2><ul>${DEVNOTES.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
 paint();
}

/* ---------- painting ---------- */
function buildList(){   // two levels: a group (with a chevron) and, inside the open one, its animations
 const CH='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 $('#list').innerHTML=QS.map((q,i)=>`<button class="gq" data-q="${i}" aria-expanded="false">${CH}<span><b>${esc(q.t)}</b><small></small></span></button><div class="gs" data-q="${i}"><div>`+
  q.places.map((x,k)=>`<button class="pq" data-q="${i}" data-p="${k}"><span>${esc(x.n)}</span><small></small></button>`).join('')+'</div></div>').join('');
}
/* a small picture of the easing: a bezier curve, or the sampled spring */
function easeSvg(m){let d;if(isSpring(m.ease)){const sp=springSamples(m.dur,m.bounce,32).pts,mx=Math.max(1.05,...sp);d='M'+sp.map((y,i)=>`${(i/32*24).toFixed(1)} ${(24-y/mx*22).toFixed(1)}`).join('L')}
 else{const b=bezOf(m);d=`M0 24C${b[0]*24} ${24-b[1]*24} ${b[2]*24} ${24-b[3]*24} 24 0`}
 return `<svg viewBox="-2 -6 28 34" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
/* a value row: slider, and the same value as a number you can type. UNIT = how a value is shown ('%' values are stored 0..1) */
const UNIT={scale:'%',op:'%',bounce:'%',off:'px',dur:'ms',delay:'ms'};
const toShow=(k,v)=>UNIT[k]==='%'?Math.round(v*1000)/10:v,fromShow=(k,v)=>UNIT[k]==='%'?v/100:v;
const sl=(grp,k,l,min,max,step,v,ends)=>(v=+v||0,`<div class="prm"><span>${esc(l)}</span><input type="range" data-g="${grp}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${esc(l)}"><label class="nf"><input type="number" data-g="${grp}" data-k="${k}" min="${toShow(k,min)}" max="${toShow(k,max)}" step="${toShow(k,step)}" value="${toShow(k,v)}" aria-label="${esc(l)}"><i>${UNIT[k]}</i></label>${ends?`<small class="ends"><span>${ends[0]}</span><span>${ends[1]}</span></small>`:''}</div>`);
/* the controls of the preset being tried: variants (basic) and exact values (Advanced) */
function paintParams(){
 const q=QS[qi];if(ps<0){$('#basic').innerHTML='';$('#mo').innerHTML='';return}
 const m=pp.m,seg=(id,l,v)=>`<div class="vr"><span>${l}</span><div class="seg" id="${id}">${STEP.map((n,i)=>`<button data-v="${i}"${v===i?' class="on"':''}>${n}</button>`).join('')}</div></div>`;
 $('#basic').innerHTML=(hasAmt(q,ps)?seg('vAmt','Amount',va):'')+seg('vDur','Duration',vs);
 $('#mo').innerHTML=q.fx.map(f=>sl('fx',f.k,f.l,f.min,f.max,f.step,pp.fx[f.k],f.ends)).join('')+sl('m','dur','Duration',0,2000,10,m.dur)+
  `<div class="prm sel"><span>Easing</span><select id="ezSel" aria-label="Easing"><optgroup label="Curve">${EZ.map(x=>`<option value="${x[0]}"${m.ease===x[0]?' selected':''}>${esc(x[1])}</option>`).join('')}</optgroup><optgroup label="Spring">${SP.map(x=>`<option value="${x[0]}"${m.ease===x[0]?' selected':''}>${esc(x[1])}</option>`).join('')}</optgroup></select>${easeSvg(m)}</div>`+
  (isSpring(m.ease)?sl('m','bounce','Bounce',0,.8,.05,m.bounce):'')+
  (q.delay?sl('m','delay',q.delay,0,280,2,m.delay):'');
}
/* the two ways to keep what is playing: for the whole group, or only for this animation */
function paintApply(){
 const q=QS[qi],d=dec[q.id],e=exOf(q,pi),eq=x=>x&&x.i===ps&&(ps<0||same(x.p,pp));
 $('#applyB').textContent=eq(d)&&!e?'Applied to the group ✓':'Apply to the group';
 $('#onlyB').textContent=eq(e)?'Only this one ✓':'Only this one';
 $('#backB').hidden=!e;
}
function paint(){
 const sumOn=qi===QS.length,q=QS[qi];
 $$('.gq').forEach(b=>{const i=+b.dataset.q,x=QS[i],on=i===qi;b.classList.toggle('open',on);b.setAttribute('aria-expanded',on);b.classList.toggle('done',!!dec[x.id]);b.querySelector('small').textContent=dec[x.id]?presetName(x,dec[x.id]):''});
 $$('.gs').forEach(g=>g.classList.toggle('open',+g.dataset.q===qi));
 $$('.pq').forEach(b=>{const x=QS[+b.dataset.q],k=+b.dataset.p,e=exOf(x,k);b.classList.toggle('on',+b.dataset.q===qi&&k===pi);b.querySelector('small').textContent=e?presetName(x,e)+' · own':''});
 $('#allDec').classList.toggle('on',sumOn);$('#allDec small').textContent=`${QS.filter(x=>dec[x.id]).length} / ${QS.length}`;
 $('#qh').hidden=sumOn;$('#dock').hidden=sumOn;if(sumOn)return;
 const d=dec[q.id];
 $('#qN').textContent=q.t;$('#qT').textContent=q.places[pi].n;
 $('#presets').innerHTML=`<button class="chip2${ps<0?' on':''}${d&&d.i<0?' ap':''}" data-ps="-1">Current</button>`+q.presets.map((x,i)=>`<button class="chip2${ps===i?' on':''}${d&&d.i===i?' ap':''}" data-ps="${i}">${esc(x.n)}</button>`).join('');
 $('#todayL').innerHTML=q.today.map(t=>`<li>${esc(t)}</li>`).join('');
 paintParams();paintApply();
}

/* ---------- controls ---------- */
$('#list').onclick=e=>{const b=e.target.closest('.gq,.pq');if(b)go(+b.dataset.q,+b.dataset.p||0)};
$('#allDec').onclick=()=>go(QS.length);
$('#presets').onclick=e=>{const b=e.target.closest('.chip2');if(!b)return;pick(+b.dataset.ps);paint();play(false)};
/* a variant step: the preset is rebuilt from its own values at that strength and length */
$('#basic').onclick=e=>{const b=e.target.closest('.seg button');if(!b||ps<0)return;
 if(va<0||vs<0)va=vs=MID;if(b.parentNode.id==='vAmt')va=+b.dataset.v;else vs=+b.dataset.v;
 pp=variant(QS[qi],ps,va,vs);paintParams();paintApply();play(false)};
/* Advanced: a slider or its number field. A value set by hand is no longer one of the variant steps;
   Duration or Bounce of a named spring makes it a custom spring */
$('#dock').addEventListener('input',e=>{const r=e.target,k=r.dataset.k;if(ps<0||!r.dataset.g)return;
 const num=r.type==='number',row=r.closest('.prm'),range=row.querySelector('input[type=range]'),field=row.querySelector('input[type=number]');
 let v=num?fromShow(k,parseFloat(r.value)):+r.value;if(isNaN(v))return;v=Math.max(+range.min,Math.min(+range.max,v));
 if(num)range.value=v;else field.value=toShow(k,v);
 if(r.dataset.g==='fx')pp.fx[k]=v;
 else{pp.m[k]=v;if(isSpring(pp.m.ease)&&k!=='delay'&&pp.m.ease!=='spring'){pp.m.ease='spring';$('#ezSel').value='spring'}
  $('#mo svg').outerHTML=easeSvg(pp.m)}
 va=vs=-1;$$('#basic .seg button.on').forEach(b=>b.classList.remove('on'));
 paintApply();later()});
/* leaving a number field: show the value that is really in use (clamped, rounded) */
$('#dock').addEventListener('focusout',e=>{const r=e.target;if(r.type!=='number'||!r.dataset.g||ps<0)return;const k=r.dataset.k;r.value=toShow(k,r.dataset.g==='fx'?pp.fx[k]:pp.m[k])});
$('#dock').addEventListener('change',e=>{if(e.target.id!=='ezSel'||ps<0)return;const m=pp.m,sp=SP.find(x=>x[0]===e.target.value);
 m.ease=e.target.value;if(sp&&sp[2]){m.dur=sp[2].dur;m.bounce=sp[2].bounce}   // a named spring brings its own duration and bounce
 va=vs=-1;paintParams();paintApply();play(false)});
$('#applyB').onclick=()=>{dec[QS[qi].id]=nowDec();dropEx();save();paint()};                              // the group, this animation included
$('#onlyB').onclick=()=>{const q=QS[qi];(ex[q.id]=ex[q.id]||{})[pi]=nowDec();save();paint()};            // an exception for this animation
$('#backB').onclick=()=>{dropEx();save();loadTarget();paint();play(false)};
$('#why').oninput=e=>{const q=QS[qi],v=e.target.value.trim();if(v)notes[q.id]=v;else delete notes[q.id];save()};
$('#again').onclick=()=>play(false);
$('#speed').onclick=e=>{const b=e.target.closest('button');if(!b)return;rate=+b.dataset.r;$$('#speed button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b)});play(false)};
$('#loop').onchange=e=>{loopOn=e.target.checked;play(false)};
$('#cmp').onchange=e=>{cmp=e.target.checked;play(true)};
$('#zoom').onchange=e=>{zoom=e.target.checked;play(true)};
function copyText(text,b,label){
 const done=ok=>{b.textContent=ok?'Copied':'Could not copy';setTimeout(()=>{b.textContent=label},1800)};
 const legacy=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();done(ok)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>done(true),legacy);else legacy();
}
$('#sum').onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('.sr'))e.target.click()};
$('#sum').onclick=e=>{const r=e.target.closest('.sr');if(r){go(+r.dataset.q,+r.dataset.p||0);return}
 if(e.target.closest('#copyDec'))copyText(decisionsText(),$('#copyDec'),'Copy decisions');
 else if(e.target.closest('#copyLink'))copyText(shareLink(),$('#copyLink'),'Copy link')};
/* ↑ ↓ walk through the animations, Space or R plays again */
addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea,select,button')||e.metaKey||e.ctrlKey||e.altKey||qi>=QS.length)return;
 const q=QS[qi];
 if(e.key===' '||e.key==='r'||e.key==='R'){e.preventDefault();play(false)}
 else if(e.key==='ArrowDown'){e.preventDefault();if(pi<q.places.length-1)go(qi,pi+1);else if(qi<QS.length-1)go(qi+1)}
 else if(e.key==='ArrowUp'){e.preventDefault();if(pi>0)go(qi,pi-1);else if(qi>0)go(qi-1,QS[qi-1].places.length-1)}
});

sanitize();if(fromLink){save();history.replaceState(null,'',location.pathname+location.search)}   // a link is imported once: later edits are not overwritten by it on reload
buildList();go(0);
</script>
</body>
</html>
