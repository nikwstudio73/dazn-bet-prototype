<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DAZN Bet in Scores — Motion</title>
<!-- A2 · Motion gallery. Desktop only; nothing in the prototype links here.
     The phone in the middle is the real prototype (index.html?embed) in a frame: this page only sets a state in it,
     starts one of its own animations, slows its clock and overrides its motion tokens. No animation is redrawn here.
     The list below (ANIMS) mirrors notes/MOTION.md: same numbers M01…M44. -->
<style>
@font-face{font-family:'DAZN Oscine';font-weight:400;src:url(assets/fonts/DAZN-Oscine-Regular.woff2) format('woff2');ascent-override:104.8%;descent-override:24%;line-gap-override:0%}
@font-face{font-family:'DAZN Oscine';font-weight:700;src:url(assets/fonts/DAZN-Oscine-Bold.woff2) format('woff2');ascent-override:104.8%;descent-override:24%;line-gap-override:0%}
/* the same chrome variables as the "Prototype states" panel in index.html (Global foundation, dark); no other colours on this page */
:root{
  --ui-canvas:#1b2326;                 /* surface/container-2 */
  --ui-panel:#0c161c;                  /* surface/container-1 */
  --ui-well:#080e12;                   /* surface/default-0 */
  --ui-line:#242d33;                   /* border/full-color/subtle */
  --ui-hover:rgba(249,250,250,0.04);   /* fill/overlay-1 */
  --ui-on:rgba(249,250,250,0.08);      /* fill/overlay-2 */
  --ui-thumb:rgba(249,250,250,0.12);   /* fill/overlay-3 */
  --ui-t1:#f9fafa;                     /* text/primary */
  --ui-t2:#c5c7ca;                     /* text/secondary */
  --ui-t3:#8d9295;                     /* text/tertiary */
  --ui-edge:16px;
}
/* One spacing scale for the whole page: 4 / 8 / 12 / 16 / 24. Control heights 24 / 32 / 40. Type 12/16, 14/20, 16/24, 20/24, 24/32. Radii 4 / 8 / 16. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ui-canvas);font-family:'DAZN Oscine',system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--ui-t2);-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:248px minmax(520px,1fr);gap:12px;padding:12px;min-width:1100px;overflow:auto hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ui-t1);outline-offset:-2px}
[hidden]{display:none!important}
.panel{min-height:0;display:flex;flex-direction:column;border-radius:16px;background:var(--ui-panel);box-shadow:0 0 0 1px var(--ui-line)}
.ph{flex:none;padding:16px 16px 12px}
.ph b{display:block;font-size:16px;line-height:24px;color:var(--ui-t1)}
.ph .seg{margin-top:12px}
.scroll{min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ui-line) transparent}

/* segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:center;padding:4px;border-radius:8px;background:var(--ui-well)}
.seg button{height:24px;padding:0 8px;border-radius:4px;font-weight:700;font-size:12px;line-height:16px;color:var(--ui-t3);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--ui-thumb);color:var(--ui-t1)}
.seg button:not(.on):hover{color:var(--ui-t2)}

/* buttons */
.btn{flex:none;height:32px;padding:0 12px;border-radius:8px;background:var(--ui-t1);font-weight:700;font-size:12px;line-height:16px;color:var(--ui-well);white-space:nowrap;transition:opacity .2s,background .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.3;cursor:default}
.btn.q{background:var(--ui-on);color:var(--ui-t1)}
.btn.q:hover{opacity:1;background:var(--ui-thumb)}
.btn.big{width:100%;height:40px;font-size:14px;line-height:20px}
.lnk{height:32px;padding:0 12px;border-radius:8px;font-weight:700;font-size:12px;line-height:16px;color:var(--ui-t2);transition:background .2s,color .2s}
.lnk:hover{background:var(--ui-hover);color:var(--ui-t1)}
.lnk.on{background:var(--ui-on);color:var(--ui-t1)}

/* left list: groups of the Decide mode, or the folded groups of All animations */
.list{padding:0 8px 8px;display:flex;flex-direction:column;gap:4px}
.lg{flex:none;margin-top:8px;padding:4px 8px;font-weight:700;font-size:12px;line-height:16px;color:var(--ui-t3)}
.list hr{flex:none;border:0;height:1px;background:var(--ui-line);margin:8px}
.ql{flex:none;display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px;border-radius:8px;text-align:left;color:var(--ui-t2);transition:background .2s,color .2s}
.ql:hover{background:var(--ui-hover);color:var(--ui-t1)}
.ql.on{background:var(--ui-on);color:var(--ui-t1)}
.ql>i{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--ui-t3);font-style:normal;font-weight:700;font-size:12px;line-height:20px;text-align:center;color:var(--ui-t3)}
.ql.done>i{background:var(--ui-t1);box-shadow:none;color:var(--ui-well)}
.ql b{display:block;font-weight:700;line-height:20px}
.ql small{display:block;font-size:12px;line-height:16px;color:var(--ui-t2)}
.ql small:empty{display:none}
.gh{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8px;text-align:left;font-weight:700;color:var(--ui-t1);transition:background .2s}
.gh:hover{background:var(--ui-hover)}
.gh svg{flex:none;color:var(--ui-t3);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.gp.open .gh svg{transform:rotate(90deg)}
.gh span{flex:1;min-width:0}
.gh i{flex:none;font-style:normal;font-weight:400;font-size:12px;line-height:16px;color:var(--ui-t3)}
.gb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.32,.72,0,1)}
.gp.open .gb{grid-template-rows:1fr}
.gb>div{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.gb>div::before,.gb>div::after{content:"";flex:none;height:0}
.li{flex:none;display:flex;align-items:center;width:100%;min-height:32px;padding:4px 8px 4px 32px;border-radius:8px;text-align:left;color:var(--ui-t2);transition:background .2s,color .2s}
.li:hover{background:var(--ui-hover);color:var(--ui-t1)}
.li.on{background:var(--ui-on);color:var(--ui-t1);font-weight:700}

/* stage: the phone (or framed prototypes), and one control column on the right */
.stage{min-width:0;min-height:0;display:flex;gap:12px}
.view{flex:1;min-width:0;min-height:0;position:relative}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:16px;background:var(--ui-canvas)}
#frame.off{visibility:hidden}
.grid{position:absolute;inset:0;overflow-y:auto;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--ui-line) transparent;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));grid-auto-rows:max-content;gap:12px;align-content:start;padding:1px} /* rows keep the height of their cards: the grid scrolls, it never squeezes them */
.grid.tall{grid-template-columns:repeat(auto-fill,var(--cw,240px));justify-content:center}
.grid.solo:not(.tall){grid-template-columns:repeat(var(--n,1),1fr)}
.card{min-width:0;border-radius:16px;background:var(--ui-panel);box-shadow:0 0 0 1px var(--ui-line);overflow:hidden;display:flex;flex-direction:column}
.cl{flex:none;display:flex;align-items:center;height:40px;padding:0 16px;text-align:left;font-weight:700;line-height:20px;color:var(--ui-t1);cursor:default}
.cl span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp{flex:none;position:relative;height:var(--vh,240px);overflow:hidden;background:var(--ui-canvas)}
.vp iframe{position:absolute;left:0;top:0;width:560px;height:1032px;border:0;transform-origin:0 0}

/* steps of an animation (All animations) */
.drawer{position:absolute;top:0;right:0;bottom:0;width:360px;z-index:2}
.det{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px}
.det h2{font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t3);margin-bottom:4px}
.det p.lead{color:var(--ui-t1)}
.note{padding:8px 12px;border-radius:8px;background:var(--ui-on);font-size:12px;line-height:16px}
.note b{color:var(--ui-t1)}
.step{display:grid;grid-template-columns:20px 1fr;gap:4px 8px;padding:12px 0;border-top:1px solid var(--ui-line)}
.step:first-of-type{border-top:0;padding-top:0}
.step:last-of-type{padding-bottom:0}
.step>i{width:20px;height:20px;border-radius:50%;background:var(--ui-on);font-style:normal;font-weight:700;font-size:12px;line-height:20px;text-align:center}
.step>b{color:var(--ui-t1);font-weight:700}
.step>div{grid-column:2;display:grid;grid-template-columns:64px 1fr;align-items:start;gap:8px}
.step>div>em{font-style:normal;font-size:12px;line-height:24px;color:var(--ui-t3)}
.step>div>span{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;line-height:24px}
.chip,.off{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:4px;font-size:12px;line-height:16px;color:var(--ui-t1);white-space:nowrap}
.chip{background:var(--ui-on)}
.chip small,.off small{font-size:12px;color:var(--ui-t3)}
.off{box-shadow:inset 0 0 0 1px var(--ui-t3)}
.det details summary{cursor:pointer;font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t3)}
.det details p{margin-top:4px}

/* My decisions */
.sum{position:absolute;inset:0;padding:24px;display:block}
.sum h1{font-size:24px;line-height:32px;color:var(--ui-t1);margin-bottom:16px}
.sr{display:grid;grid-template-columns:24px 1fr 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--ui-line);align-items:baseline;cursor:pointer}
.sr i{font-style:normal;font-size:12px;color:var(--ui-t3)}
.sr b{color:var(--ui-t1)}
.sr span.no,.sr small{color:var(--ui-t3)}
.sr small{grid-column:2/-1;font-size:12px;line-height:16px}
.acts{display:flex;gap:8px;margin-top:24px}
.sum h2{margin:24px 0 8px;font-size:12px;line-height:16px;color:var(--ui-t3)}
.sum ul{padding-left:16px}
.sum li{margin-bottom:4px;font-size:12px;line-height:16px}

/* right column */
.rc{flex:none;width:312px;min-height:0;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.qh{flex:none;padding:4px 4px 0}
.qh span{display:block;font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t3)}
.qh h1{font-size:20px;line-height:24px;font-weight:700;color:var(--ui-t1)}
.qh p,#pDesc,#dHint{display:none}
.places{flex:none;padding:12px 8px 8px;gap:4px}
.places>b{padding:0 8px 4px;font-size:12px;line-height:16px;color:var(--ui-t3)}
.pl{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8px;text-align:left;color:var(--ui-t2);transition:background .2s,color .2s}
.pl:hover{background:var(--ui-hover);color:var(--ui-t1)}
.pl.on{background:var(--ui-on);color:var(--ui-t1)}
.pl svg{flex:none;width:20px;height:20px;color:var(--ui-t3)}
.pl.on svg{color:var(--ui-t1)}
.pl b{font-weight:700}
.dock{flex:none;padding:12px;gap:12px}
.lbl{font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t3)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip2{height:32px;padding:0 12px;border-radius:16px;background:var(--ui-hover);box-shadow:inset 0 0 0 1px var(--ui-line);font-weight:700;font-size:12px;line-height:16px;color:var(--ui-t2);white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.chip2:hover{background:var(--ui-on);color:var(--ui-t1)}
.chip2.on{background:var(--ui-t1);box-shadow:none;color:var(--ui-well)}
.chip2.ap::after{content:" ✓"}
.pr{display:flex;flex-direction:column;gap:4px}
.pr:empty{display:none}
.prm{display:grid;grid-template-columns:80px 1fr 52px;align-items:center;gap:0 8px;min-height:32px;font-size:12px;line-height:16px}
.prm{grid-template-columns:72px 1fr 64px}
.vr{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px;min-height:32px;font-size:12px;line-height:16px}
.vr .seg button{padding:0 4px}
/* the slider: a 24 px tall grab area, a 4 px track, a 16 px thumb */
.prm input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:24px;background:none;cursor:pointer;touch-action:none}
.prm input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--ui-thumb)}
.prm input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--ui-thumb)}
.prm input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border:0;border-radius:50%;background:var(--ui-t1);box-shadow:0 0 0 4px var(--ui-panel);transition:transform .2s}
.prm input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ui-t1);box-shadow:0 0 0 4px var(--ui-panel)}
.prm input[type=range]:hover::-webkit-slider-thumb,.prm input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.prm input[type=range]:focus-visible{outline:0}
.prm input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--ui-thumb)}
.nf{display:flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 0;border-radius:4px;background:var(--ui-well);cursor:text}
.nf input{width:100%;min-width:0;height:24px;padding:0 0 0 4px;border:0;background:none;font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t1);text-align:right;outline:0;-moz-appearance:textfield}
.nf input::-webkit-inner-spin-button{display:none}
.nf i{flex:none;font-style:normal;font-size:12px;color:var(--ui-t3)}
.nf:focus-within{box-shadow:inset 0 0 0 1px var(--ui-t3)}
.ends{grid-column:2;display:flex;justify-content:space-between;padding-bottom:4px;font-size:12px;line-height:16px;color:var(--ui-t3);pointer-events:none} /* never in the way of the slider above it */
.prm.sel{grid-template-columns:80px 1fr 32px}
.prm select{width:100%;height:32px;padding:0 8px;border-radius:8px;border:0;background:var(--ui-well);font-size:12px;color:var(--ui-t1)}
.prm svg{display:block;width:32px;height:32px;border-radius:8px;background:var(--ui-well);color:var(--ui-t1)}
.dh{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.df{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--ui-line)}
.df span{flex:1}
/* a switch row: label on the left, switch on the right */
.chk{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;font-size:12px;line-height:16px;cursor:pointer;transition:color .2s}
.chk:hover{color:var(--ui-t1)}
.chk input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:32px;height:20px;border-radius:12px;background:var(--ui-thumb);cursor:pointer;transition:background .2s}
.chk input::after{content:"";position:absolute;left:4px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--ui-t2);transition:transform .2s,background .2s}
.chk input:checked{background:var(--ui-t1)}
.chk input:checked::after{transform:translateX(12px);background:var(--ui-well)}
.chk input:focus-visible{outline:2px solid var(--ui-t1);outline-offset:4px}
/* Advanced, and Today inside it: a row with a chevron that opens its content */
.adv{border-top:1px solid var(--ui-line);padding-top:4px}
.adv>summary,.today>summary{display:flex;align-items:center;gap:8px;height:32px;margin:0 -4px;padding:0 4px;border-radius:8px;list-style:none;cursor:pointer;font-size:12px;line-height:16px;font-weight:700;color:var(--ui-t3);outline:0;transition:background .2s,color .2s}
.adv>summary::-webkit-details-marker,.today>summary::-webkit-details-marker{display:none}
.adv>summary::before,.today>summary::before{content:"";flex:none;width:8px;height:8px;margin:0 4px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg) scale(.75);transition:transform .2s}
.adv[open]>summary::before,.today[open]>summary::before{transform:rotate(45deg) scale(.75)}
.adv>summary:hover,.today>summary:hover,.adv>summary:focus-visible,.today>summary:focus-visible{background:var(--ui-hover);color:var(--ui-t1)}
.adv[open]>summary{color:var(--ui-t1);margin-bottom:4px}
.adv>.pr{padding-bottom:8px}
.adv>.chk,.today,.adv>.lbl{border-top:1px solid var(--ui-line)}
.adv>.chk{min-height:40px}
.adv>summary+.chk{border-top:0}
.today{padding-top:4px}
.today ul{margin-bottom:8px;padding:8px 8px 8px 24px;border-radius:8px;background:var(--ui-well)}
.today li{margin-bottom:4px;font-size:12px;line-height:16px}
.today li:last-child{margin:0}
.adv>.lbl{display:block;padding-top:12px}
#why{display:block;width:100%;margin-top:8px;resize:none;min-height:56px;padding:8px;border-radius:8px;border:0;background:var(--ui-well);box-shadow:inset 0 0 0 1px var(--ui-line);font-size:12px;line-height:16px;color:var(--ui-t1);outline:0;transition:box-shadow .2s}
#why:focus{box-shadow:inset 0 0 0 1px var(--ui-t3)}
/* All animations dock */
.now b{display:block;font-size:16px;line-height:24px;color:var(--ui-t1)}
.now span{display:block;font-size:12px;line-height:16px;color:var(--ui-t3)}
.now span:empty{display:none}
.tk{display:flex;flex-direction:column;gap:4px}
.tr.ro{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;min-height:32px;font-size:12px;line-height:16px}
.tr.ro label b{display:block;font-weight:400;color:var(--ui-t1)}
.tr.ro label span{display:block;color:var(--ui-t3)}
.tr.ro>b{font-weight:400;text-align:right}
#copyOut{font:inherit;font-size:12px;line-height:16px;white-space:pre-wrap;padding:8px;border-radius:8px;background:var(--ui-well);max-height:96px;overflow:auto}

/* more air in the control column (still on the 4 px scale) */
.rc{width:328px;gap:16px}
.places{padding:16px 8px 8px}
.places>b{padding:0 8px 8px}
.dock{padding:16px;gap:16px}
.dock>.lbl{margin-bottom:-8px}          /* a label sits 8 px above what it names, 16 px below what came before */
.chips{gap:8px}
.pr{gap:8px}
.vr{gap:12px}
.df{padding-top:16px}
.adv{padding-top:8px}
.adv>summary,.today>summary{height:40px}
.adv[open]>summary{margin-bottom:8px}
.adv>.pr{gap:12px;padding-bottom:16px}
.adv>.chk{min-height:48px}
.today{padding-top:8px}
.today ul{margin-bottom:12px;padding:12px 12px 12px 28px}
.today li{margin-bottom:8px}
.adv>.lbl{padding-top:16px}
#why{margin-top:8px;padding:12px}
/* the three viewing switches sit together, always in sight */
.tgl{display:flex;flex-direction:column}
.tgl .chk{min-height:40px}
.tgl .chk+.chk{border-top:1px solid var(--ui-line)}

/* left list without numbers: a quiet dot for "not decided", a tick for "decided" */
#qN{display:none}
.ql{align-items:center;min-height:40px;padding:8px 12px 8px 8px}
.ql>i{position:relative;width:16px;height:16px;border-radius:50%;box-shadow:none;background:none}
.ql>i::before{content:"";position:absolute;left:4px;top:4px;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ui-t3);transition:background .2s,box-shadow .2s}
.ql.done>i{background:none}
.ql.done>i::before{left:0;top:0;width:16px;height:16px;background:var(--ui-t1);box-shadow:none}
.ql.done>i::after{content:"";position:absolute;left:4px;top:4px;width:8px;height:4px;border-left:1.5px solid var(--ui-well);border-bottom:1.5px solid var(--ui-well);transform:rotate(-45deg)}
.ql>div{flex:1;min-width:0}
.ql.all{padding-left:32px}
.ql.all>small{flex:none;color:var(--ui-t3)}
.sr{grid-template-columns:1fr 1fr}
.sr small{grid-column:1/-1}
</style>
</head>
<body>
<aside class="panel">
 <div class="ph"><b>Motion</b>
  <div class="seg" id="appSeg" role="tablist" aria-label="Mode"><button role="tab" data-app="decide" class="on">Decide</button><button role="tab" data-app="browse">All animations</button></div>
 </div>
 <div class="scroll list" id="list"></div>
</aside>

<main class="stage">
 <div class="view">
  <iframe id="frame" src="index.html?embed" title="Prototype"></iframe>
  <div class="grid" id="grid" hidden></div>
  <div class="panel sum scroll" id="sum" hidden></div>
  <div class="panel drawer" id="drawer" hidden>
   <div class="ph"><b>Steps</b></div>
   <div class="scroll det" id="det"></div>
  </div>
 </div>
 <!-- everything you control sits in this one column; the phone gets the full height -->
 <aside class="rc scroll">
  <!-- Decide: a group, where to watch it, its presets -->

<script>
/* ---------- tokens: the five durations and the curves of the prototype (defaults = values in index.html) ---------- */
const TOKENS=[
 {k:'--m-press', ms:120, max:400,  js:null,      use:'press feedback'},
 {k:'--m-quick', ms:200, max:600,  js:'T.quick', use:'colour, opacity'},
 {k:'--m-std',   ms:320, max:900,  js:'T.std',   use:'an element enters, a text swaps'},
 {k:'--m-layout',ms:440, max:1200, js:'T.layout',use:'heights and pages'},
 {k:'--m-sheet', ms:500, max:1400, js:'T.sheet', use:'sheets, bar, toast, overlay'},
 {k:'--soft', cv:[.32,.72,0,1],  js:'SOFT', use:'anything that travels or resizes'},
 {k:'--ease', cv:[.2,.8,.2,1],   js:null,   use:'state changes in place'},
 {k:'--exit', cv:[.4,0,.6,1],    js:null,   use:'not in the token table: limit tongue, removed card'}
];
const TK=Object.fromEntries(TOKENS.map(t=>[t.k,t]));
const MIRROR={'T.quick':'--m-quick','T.std':'--m-std','T.layout':'--m-layout','T.sheet':'--m-sheet','SOFT':'--soft'};
const FIXED={'--chg-in':'.8s','--chg-fade':'1.5s','--chg-fade-pick':'.6s','--dev':'.55s'}; // variables of the prototype that are not motion tokens
const n2=n=>String(+(+n).toFixed(3)).replace(/^0\./,'.').replace(/^-0\./,'-.');
const fmtS=ms=>n2(ms/1000)+'s',fmtC=c=>'cubic-bezier('+c.map(n2).join(',')+')';
const val={};TOKENS.forEach(t=>val[t.k]=t.cv?[...t.cv]:t.ms);
const changed=k=>TK[k].cv?fmtC(val[k])!==fmtC(TK[k].cv):val[k]!==TK[k].ms;
const css=k=>TK[k].cv?fmtC(val[k]):fmtS(val[k]);
const dflt=k=>TK[k].cv?fmtC(TK[k].cv):fmtS(TK[k].ms);

/* ---------- the list ----------
 ph: phases as [what, duration, curve]. Token names are written as they are in the code; {…} marks a time or a curve that
 is written as a number or a keyword instead of a token (off-token).
 setup / play: code that runs INSIDE the prototype (same names as in index.html). G.* are the helpers of this page:
 G.after(ms,fn) waits on the prototype's (slowed) clock, G.click(sel) clicks a real element, G.press(sel) applies the
 element's own :active rule for a moment, G.drag(sel,px,then) drags like a finger, G.show(sel,scroller) scrolls to it.
 slow: 'part' = one part cannot be slowed (why: slowNote), 'sim' = the press is simulated, 'none' = nothing to play. */
const P3="S.sel=P3();refresh();",P3S=P3+"openSheet();",ONES="S.sel=ONE();refresh();openSheet();";
const GROUPS=['Press feedback','State change in place','Price change','Element appears or leaves','Height and layout','Sheets, bar, toast, overlay','Pages and feed','Prototype chrome (not product)'];
const PRESS_INT='Releasing early reverses from where the scale is.';
const REV='A CSS transition: tapping back mid-way reverses from the current position.';
const ANIMS=[
 // 1 · press feedback

  ph:[['Press in and release','--m-press','{not set · browser default}']],int:PRESS_INT,slow:'sim',
  play:`G.press('#feed .odd[data-m="m1"][data-o="1"]')`},
 {id:'M02',g:0,n:'Outcome button press (fixture)',what:'The outcome button on the fixture page shrinks to 98 %.',trig:'Finger down on an outcome (:active).',

 {id:'M05',g:0,n:'Main button press',what:'"Place bet on DAZN Bet" shrinks to 98 %.',trig:'Finger down on the button (:active).',

 {id:'M18',g:1,n:'Scroll hints',what:'A line under the sheet header; cards fade out above the button; the top bar of the fixture page.',trig:'Scrolling the sheet (> 42 px), cards below the edge, scrolling the fixture page (> 150 px).',

$('#applyB').onclick=()=>{const q=QS[qi];dec[q.id]={i:ps,p:pp?clone(pp):null,v:[va,vs]};saveDec();showQuestion(qi+1)};   // apply, then on to the next group
$('#why').oninput=e=>{const q=QS[qi],v=e.target.value.trim();if(v)notes[q.id]=v;else delete notes[q.id];saveDec()};
$('#loop').onchange=e=>{loopOn=e.target.checked;playDecide(false)};
$('#cmp').onchange=e=>{cmp=e.target.checked;playDecide(true)};
$('#zoom').onchange=e=>{zoom=e.target.checked;playDecide(true)};
$('#speedD').onclick=e=>{const b=e.target.closest('button');if(!b)return;rate=+b.dataset.r;document.querySelectorAll('#speedD button').forEach(x=>x.classList.toggle('on',x===b));playDecide(false)};
function decisionsText(){
 return 'Motion presets — DAZN Bet in Scores\n'+QS.map((q,i)=>`${i+1}. ${q.t}: ${decText(q)||'not decided'}`+(notes[q.id]?`\n   Why: ${notes[q.id]}`:'')).join('\n')+'\n\nFor development:\n'+DEVNOTES.map(t=>'- '+t).join('\n');
}
const shareLink=()=>location.href.split('#')[0]+'#d='+btoa(unescape(encodeURIComponent(JSON.stringify({dec,notes}))));
function showSummary(){
 clearTimeout(loopT);dropCards();$('#grid').innerHTML='';$('#grid').hidden=true;$('#frame').classList.add('off');if(main.ready)main.reset();
 const s=$('#sum');s.hidden=false;main.ov=null;
 s.innerHTML=`<h1>My decisions</h1>`+QS.map((q,i)=>`<div class="sr" data-q="${i}" role="button" tabindex="0"><b>${esc(q.t)}</b><span${dec[q.id]?'':' class="no"'}>${esc(decText(q)||'Not decided')}</span>${notes[q.id]?`<small>Why: ${esc(notes[q.id])}</small>`:''}</div>`).join('')+
  `<div class="acts"><button class="btn" id="copyDec">Copy decisions</button><button class="btn q" id="copyLink" title="A link that opens this page with the same decisions">Copy link</button></div><h2>For development</h2><ul>${DEVNOTES.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
 paintDecide();
}
$('#sum').onclick=e=>{const r=e.target.closest('.sr');if(r){showQuestion(+r.dataset.q);return}
 if(e.target.closest('#copyDec'))copyText(decisionsText(),$('#copyDec'),'Copy decisions');
 else if(e.target.closest('#copyLink'))copyText(shareLink(),$('#copyLink'),'Copy link')};
$('#prevQ').onclick=()=>showQuestion(qi-1);$('#nextQ').onclick=()=>showQuestion(qi+1);
$('#againD').onclick=replay;
function buildQList(){   // no numbers: a group shows only whether it is decided (a tick) and which preset was applied
 let h='',last='';QS.forEach((q,i)=>{const sc=SECT[q.id];if(sc!==last){h+=`<div class="lg">${esc(sc)}</div>`;last=sc}
  h+=`<button class="ql" data-q="${i}"><i></i><div><b>${esc(q.t)}</b><small></small></div></button>`});
 $('#list').innerHTML=h+`<hr><button class="ql all" data-q="${QS.length}"><div><b>My decisions</b></div><small></small></button>`;
 $('#list').onclick=e=>{const b=e.target.closest('.ql');if(b)showQuestion(+b.dataset.q)};
}
function setApp(a){
 app=a;document.querySelectorAll('#appSeg button').forEach(b=>b.classList.toggle('on',b.dataset.app===a));
 const d=a==='decide';main.ov=null;$('#dockB').hidden=d;$('#drawer').hidden=true;$('#stepsBtn').classList.remove('on');$('#stepsBtn').textContent='Show steps';
 clearTimeout(loopT);
 if(d){rate=+document.querySelector('#speedD .on').dataset.r;buildQList();showQuestion(qi)}
 else{rate=+document.querySelector('#speed .on').dataset.r;$('#qh').hidden=true;$('#dockD').hidden=true;$('#sum').hidden=true;$('#places').hidden=true;buildList();showOne(cur)}
}
$('#appSeg').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.app!==app)setApp(b.dataset.app)};

/* ---------- All animations: groups fold; a group has "All together" and its animations ---------- */
const ICO='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function buildList(){
 $('#list').innerHTML=GROUPS.map((g,gi)=>{if(gi>6)return '';const items=ANIMS.filter(a=>a.g===gi);
  return `<div class="gp" data-g="${gi}"><button class="gh" aria-expanded="false">${ICO}<span>${esc(g)}</span><i>${items.length}</i></button><div class="gb"><div>`+
   items.map(a=>`<button class="li" data-i="${ANIMS.indexOf(a)}"><span>${esc(a.n)}</span></button>`).join('')+'</div></div></div>'}).join('');
 $('#list').onclick=e=>{
  const h=e.target.closest('.gh');if(h){showOne(ANIMS.findIndex(a=>a.g===+h.parentNode.dataset.g));return}   // a group opens on its first animation
  const b=e.target.closest('.li');if(b)showOne(+b.dataset.i)};
}
function paintAll(){
 const one=mode==='one',a=ANIMS[cur];
 document.querySelectorAll('.gp').forEach(p=>{const on=+p.dataset.g===grp;p.classList.toggle('open',on);p.querySelector('.gh').setAttribute('aria-expanded',on)});
 document.querySelectorAll('.li').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur));
 $('#nowT').textContent=one?a.n:GROUPS[grp];
 $('#again').disabled=one&&(a.slow==='none'||!a.play);
 paintDetail();paintKnobs();
}
const stepsHTML=a=>{const row=(l,v)=>v&&v!=='—'?`<div><em>${l}</em><span>${rich(v)}</span></div>`:'';
 return a.ph.map((p,n)=>`<div class="step"><i>${n+1}</i><b>${rich(p[0])}</b>${row('Duration',p[1])}${row('Curve',p[2])}</div>`).join('')};
function paintDetail(){
 if(mode==='group'){   // side by side: the steps of each, one under another, so the differences are easy to see
  $('#det').innerHTML=inGroup(grp).map(a=>`<div class="cmp"><h3>${esc(a.n)}</h3>${stepsHTML(a)}${a.diff?`<p>${rich(a.diff)}</p>`:''}</div>`).join('');return}
 const a=ANIMS[cur];
 const slow=a.slow==='part'?`<div class="note"><b>Not fully slowed.</b> ${esc(a.slowNote)}</div>`
  :a.slow==='sim'?`<div class="note"><b>The press is made by this page.</b> Code cannot hold a finger down, so the page switches on the element’s own pressed style for a moment. Time and curve are the prototype’s. You can also press it on the phone yourself.</div>`
  :a.slow==='none'?`<div class="note"><b>Not shown here.</b> ${esc(a.slowNote)}</div>`:'';
 $('#det').innerHTML=`${slow}
  <div><h2>What moves</h2><p class="lead">${esc(a.what)}</p></div>
  <div><h2>Starts when</h2><p>${esc(a.trig)}</p></div>
  <div><h2>Steps</h2>${stepsHTML(a)}</div>
  ${a.diff?`<div><h2>Similar things are done differently</h2><p>${rich(a.diff)}</p></div>`:''}
  <div><h2>If interrupted</h2><p>${esc(a.int)}</p></div>
  <details><summary>With Reduce motion switched on</summary><p>${rich(RM_TEXT)}</p></details>`;
}

/* ---------- tokens: shown for reference only. Motion is changed in Decide, so there is one place for decisions ---------- */
let showAll=false;
function buildKnobs(){
 $('#tk').innerHTML=TOKENS.map(t=>`<div class="tr ro"><label><b>${t.k}</b><span>${esc(t.use)}</span></label><b>${t.cv?t.cv.map(n2).join(', '):t.ms+' ms'}</b></div>`).join('');
 $('#stepsBtn').onclick=()=>{const d=$('#drawer');d.hidden=!d.hidden;$('#stepsBtn').classList.toggle('on',!d.hidden);$('#stepsBtn').textContent=d.hidden?'Show steps':'Hide steps';$('#stepsBtn').setAttribute('aria-expanded',!d.hidden)};
 $('#allBtn').onclick=()=>{showAll=!showAll;$('#allBtn').classList.toggle('on',showAll);$('#allBtn').setAttribute('aria-pressed',showAll);$('#tk').hidden=!showAll};
}
function paintKnobs(){}
function copyText(text,b,label){
 const o=$('#copyOut'),done=ok=>{b.textContent=ok?'Copied':'Could not copy';if(!ok&&app==='browse'){o.textContent=text;o.hidden=false}setTimeout(()=>{b.textContent=label},1800)};
 const legacy=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();done(ok)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>done(true),legacy);else legacy();
}

/* ---------- controls ---------- */
$('#speed').onclick=e=>{const b=e.target.closest('button');if(!b)return;rate=+b.dataset.r;document.querySelectorAll('#speed button').forEach(x=>x.classList.toggle('on',x===b));replay()};
$('#again').onclick=replay;
addEventListener('keydown',e=>{
 if(e.target.matches('input')||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key===' '||e.key==='r'||e.key==='R'){e.preventDefault();replay();return}
 if(app==='decide'){if(e.key==='ArrowRight'){e.preventDefault();showQuestion(qi+1)}else if(e.key==='ArrowLeft'){e.preventDefault();showQuestion(qi-1)}return}
 if(e.key==='ArrowDown'){e.preventDefault();showOne(mode==='one'?cur+1:ANIMS.findIndex(a=>a.g===grp))}
 else if(e.key==='ArrowUp'){e.preventDefault();if(mode==='one')showOne(cur-1)}
});
buildKnobs();
setApp('decide');   // opens on the first question
</script>
</body>
</html>
